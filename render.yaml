services:
  - type: web
    name: creditcompass
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
